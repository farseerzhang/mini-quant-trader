[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-quant-trader"
version = "0.1.0"
description = "A local quantitative trading research application"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2.54",
]

[tool.setuptools.packages.find]
include = ["quant*"]
