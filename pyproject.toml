[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-quant-trader"
version = "0.1.0"
description = "A local quantitative trading research application"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.54",
    "SQLAlchemy>=2.0",
    "exchange-calendars>=4.5",
    "PyYAML>=6.0",
    "vectorbt>=1.1.2",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["quant*"]